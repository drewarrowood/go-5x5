<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5×5 Go</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>5×5 Go</h1>
      <p class="sub">Black first. Two passes end it. Stones plus the empty points you surround.</p>
    </header>
    <div class="table">
      <div class="board-wrap">
        <canvas id="board" width="560" height="560"></canvas>
      </div>
      <aside class="panel">
        <div class="turn" id="turn">Black to play</div>
        <div class="caps">
          <span>Black took <b id="cap-b">0</b></span>
          <span>White took <b id="cap-w">0</b></span>
        </div>
        <div class="score hidden" id="score"></div>

        <div class="who">
          <label class="who-row">
            <span>Black</span>
            <select id="black-player">
              <option value="human" selected>Human</option>
              <option value="machine">Machine</option>
            </select>
          </label>
          <label class="who-row">
            <span>White</span>
            <select id="white-player">
              <option value="human">Human</option>
              <option value="machine" selected>Machine</option>
            </select>
          </label>
        </div>

        <div id="machine-box" class="machine-box">
          <div id="self-play-btns" class="actions self-play hidden">
            <button type="button" id="btn-start">Start</button>
            <button type="button" id="btn-pause" disabled>Pause</button>
          </div>
          <label class="speed">
            <span>Speed</span>
            <input type="range" id="speed" min="1" max="5" value="2" />
            <span id="speed-label">slow</span>
          </label>
        </div>

        <div class="actions">
          <button type="button" id="btn-pass">Pass</button>
          <button type="button" id="btn-new">New game</button>
        </div>

        <ol class="log" id="log" aria-label="Game log"></ol>

        <p class="hint">A1 is bottom-left; the center is C3. A move with no liberties is illegal unless it takes.</p>
      </aside>
    </div>
  </div>
  <script src="go.js"></script>
</body>
</html>
